<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c2570c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Sopralluogo di cantiere</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--tx:#1d1b19;--mut:#6b6560;--ac:#c2570c;--bd:#e2ddd7}
@media(prefers-color-scheme:dark){:root{--bg:#171513;--card:#24211e;--tx:#f1ede8;--mut:#a39c94;--bd:#3a3631}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--ac);color:#fff;padding:14px 16px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
header button{background:none;border:0;color:#fff;font-size:22px;padding:0 6px}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button.b{flex:1;min-width:120px;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
button.s{background:var(--bd);color:var(--tx)}
button.d{background:#b3261e}
button:disabled{opacity:.5}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
input[type=text],input[type=date]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--card);color:var(--tx)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px}
.it .t{flex:1}.it small{color:var(--mut)}
.mut{color:var(--mut)}
.th{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.hide{display:none}
</style>
</head>
<body>
<header><button id="back" class="hide">&#8592;</button><span id="ttl">Sopralluogo di cantiere</span></header>
<main id="app"></main>
<input id="fg" type="file" accept="image/*" multiple class="hide">
<input id="fc" type="file" accept="image/*" capture="environment" class="hide">
<script>
// ===== Impostazioni =====
const MAX_PX = 1600;      // lato massimo in pixel (modificabile)
const QUALITA = 0.85;     // qualità JPEG

// ===== Dati =====
const KEY = 'sopralluoghi_v1';
let lista = JSON.parse(localStorage.getItem(KEY) || '[]');
const salva = () => localStorage.setItem(KEY, JSON.stringify(lista));
let corrente = null, urls = [];
const $ = s => document.querySelector(s);
const oggi = () => new Date().toISOString().slice(0, 10);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d.split('-').reverse().join('/');

// ===== Archivio foto (IndexedDB, solo su questo dispositivo) =====
const dbp = new Promise((ok, ko) => {
  const r = indexedDB.open('sopralluogo_foto', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('foto', { keyPath: 'id', autoIncrement: true }).createIndex('sid', 'sid');
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
});
const tx = async (m, fn) => { const db = await dbp; return new Promise((ok, ko) => { const t = db.transaction('foto', m), st = t.objectStore('foto'); let res; const q = fn(st); if (q) q.onsuccess = () => res = q.result; t.oncomplete = () => ok(res); t.onerror = () => ko(t.error); }); };
const fotoDi = async sid => (await tx('readonly', st => st.index('sid').getAll(sid))).sort((a, b) => a.ts - b.ts || a.id - b.id);
const aggFoto = r => tx('readwrite', st => st.add(r));
const delFoto = id => tx('readwrite', st => st.delete(id));
const delTutte = async sid => { for (const f of await fotoDi(sid)) await delFoto(f.id); };
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

function home() {
  corrente = null; $('#back').classList.add('hide'); $('#ttl').textContent = 'Sopralluogo di cantiere';
  $('#app').innerHTML = '<button class="b" style="width:100%;margin-bottom:12px" id="nuovo">+ Nuovo sopralluogo</button>' +
    (lista.length ? lista.slice().sort((a, b) => b.data.localeCompare(a.data)).map(s =>
      `<div class="card it" data-id="${s.id}"><div class="t"><b>${esc(s.nome)}</b><br><small>${fmt(s.data)}</small></div><span>&#8250;</span></div>`).join('')
      : '<p class="mut">Nessun sopralluogo. Creane uno per iniziare.</p>');
  $('#nuovo').onclick = () => modulo();
  document.querySelectorAll('[data-id]').forEach(e => e.onclick = () => dettaglio(e.dataset.id));
}

function modulo(id) {
  const s = lista.find(x => x.id === id) || { data: oggi(), nome: '' };
  $('#back').classList.remove('hide'); $('#back').onclick = () => id ? dettaglio(id) : home();
  $('#ttl').textContent = id ? 'Modifica sopralluogo' : 'Nuovo sopralluogo';
  $('#app').innerHTML = `<div class="card"><label>Data</label><input type="date" id="d" value="${s.data}">
    <label>Nome del cantiere</label><input type="text" id="n" value="${esc(s.nome)}" placeholder="Es. Via Roma 12">
    <div class="row" style="margin-top:14px"><button class="b" id="ok">${id ? 'Salva' : 'Crea sopralluogo'}</button></div></div>`;
  $('#ok').onclick = () => {
    const data = $('#d').value, nome = $('#n').value.trim();
    if (!data || !nome) return alert('Inserisci data e nome del cantiere');
    if (id) { Object.assign(s, { data, nome }); } else { s.id = String(Date.now()); s.data = data; s.nome = nome; lista.push(s); }
    salva(); dettaglio(s.id);
  };
}

async function dettaglio(id) {
  corrente = id; const s = lista.find(x => x.id === id);
  $('#back').classList.remove('hide'); $('#back').onclick = home; $('#ttl').textContent = s.nome;
  $('#app').innerHTML = `<div class="card"><b>${esc(s.nome)}</b><br><small class="mut">${fmt(s.data)}</small>
    <div class="row" style="margin-top:10px"><button class="b s" id="mod">Modifica</button><button class="b s d" id="del" style="color:#fff">Elimina</button></div></div>
    <div class="row" style="margin-bottom:10px"><button class="b" id="gal">Galleria</button><button class="b" id="cam">Camera</button></div>
    <div class="card"><b id="cnt">...</b><div class="th" id="th"></div><small class="mut">Tocca una miniatura per eliminare quella foto.</small></div>
    <button class="b" style="width:100%" id="exp" disabled>Esporta ZIP</button><p class="mut" id="st"></p>`;
  $('#mod').onclick = () => modulo(id);
  $('#del').onclick = async () => { if (confirm('Eliminare il sopralluogo e le sue foto salvate nell\'app? Le foto originali nel telefono non vengono toccate.')) { await delTutte(id); lista = lista.filter(x => x.id !== id); salva(); home(); } };
  $('#gal').onclick = () => $('#fg').click();
  $('#cam').onclick = () => $('#fc').click();
  $('#exp').onclick = () => esporta(s);
  await miniature();
}
async function miniature() {
  if (!corrente) return;
  const f = await fotoDi(corrente); urls.forEach(URL.revokeObjectURL); urls = [];
  $('#cnt').textContent = f.length + (f.length === 1 ? ' foto' : ' foto');
  $('#exp').disabled = !f.length; $('#th').innerHTML = '';
  f.forEach(r => { const i = new Image(), u = URL.createObjectURL(r.th); urls.push(u); i.src = u;
    i.onclick = async () => { if (confirm('Eliminare questa foto dal sopralluogo?')) { await delFoto(r.id); miniature(); } };
    $('#th').appendChild(i); });
}
async function aggiungi(inp) {
  if (!corrente) return; const sid = corrente, st = $('#st'); const files = [...inp.files]; inp.value = '';
  const esist = new Set((await fotoDi(sid)).map(r => r.k)); let n = 0;
  for (const file of files) {
    const k = file.name + '|' + file.size + '|' + file.lastModified;
    if (esist.has(k)) continue; esist.add(k);
    st.textContent = `Salvo foto ${++n}...`;
    try { await aggFoto({ sid, k, ts: file.lastModified, img: await ridimensiona(file, MAX_PX, QUALITA), th: await ridimensiona(file, 240, 0.7) }); } catch (e) { st.textContent = 'Errore: ' + e.message; }
    if (corrente === sid) await miniature();
  }
  st.textContent = n ? '' : 'Nessuna foto nuova (già presenti).';
}
$('#fg').onchange = e => aggiungi(e.target);
$('#fc').onchange = e => aggiungi(e.target);

// ===== Export =====
async function ridimensiona(file, max, q) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close();
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
const crcT = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zip(files) { // files: [{name, data}] ZIP senza compressione (i JPEG sono già compressi)
  const enc = new TextEncoder(), parts = [], cd = []; let off = 0;
  for (const f of files) {
    const n = enc.encode(f.name), crc = crc32(f.data), h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint32(14, crc, true); h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, n.length, true);
    parts.push(h.buffer, n, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, n.length, true); c.setUint32(42, off, true);
    cd.push(c.buffer, n); off += 30 + n.length + f.data.length;
  }
  const sz = cd.reduce((a, b) => a + (b.byteLength ?? b.length), 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, sz, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cd, e.buffer], { type: 'application/zip' });
}
async function esporta(s) {
  const st = $('#st'), btn = $('#exp'); btn.disabled = true;
  try {
    const ord = await fotoDi(s.id); // già in ordine cronologico di scatto
    const d = s.data.replace(/-/g, ''), cart = d + '_' + s.nome.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_');
    const out = [];
    for (let i = 0; i < ord.length; i++) {
      st.textContent = `Preparo foto ${i + 1} di ${ord.length}...`;
      out.push({ name: `${cart}/${d}_${String(i + 1).padStart(2, '0')}.jpg`, data: new Uint8Array(await ord[i].img.arrayBuffer()) });
    }
    const file = new File([zip(out)], cart + '.zip', { type: 'application/zip' });
    // Chrome non consente di condividere i .zip: si salva lo ZIP in Download (affidabile) oppure si prova l'invio con estensione .txt
    const alt = new File([file], cart + '.zip.txt', { type: 'text/plain' });
    st.innerHTML = `<b>ZIP pronto (${ord.length} foto)</b><div class="row" style="margin-top:8px"><button class="b" id="sv">Salva ZIP sul telefono</button><button class="b s" id="sh">Condividi (prova)</button></div><p id="msg" class="mut">Dopo il salvataggio allega lo ZIP da WhatsApp o mail. "Condividi (prova)" invia il file come <i>nome.zip.txt</i>: sul PC togli ".txt".</p>`;
    $('#sh').onclick = async () => {
      try {
        if (navigator.canShare && navigator.canShare({ files: [alt] })) await navigator.share({ files: [alt], title: cart });
        else $('#msg').textContent = 'Condivisione non disponibile: usa "Salva ZIP sul telefono".';
      } catch (e) { if (e.name !== 'AbortError') $('#msg').textContent = 'Condivisione non riuscita (' + e.name + '): usa "Salva ZIP sul telefono".'; }
    };
    $('#sv').onclick = () => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
      $('#msg').textContent = 'ZIP salvato nella cartella Download.';
    };
  } catch (e) { st.textContent = 'Errore: ' + e.message; }
  btn.disabled = false;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
home();
</script>
</body>
</html>
